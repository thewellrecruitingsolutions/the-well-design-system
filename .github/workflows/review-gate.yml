name: review-gate

# Agent review gate (advisory, severity-classified). Runs on every PR, posts a classified
# findings comment (CRITICAL / WARN / NIT), and emits REVIEW_SEVERITY on the last line so
# the morning digest can surface CRITICAL items to the owner. Gate is ADVISORY: always
# exits 0 and never blocks merge. Needs org-level ANTHROPIC_API_KEY secret.
# Dependabot PRs auto-PASS (pure dep bumps).

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  gate-self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify severity-line parsing
        run: |
          echo "REVIEW_SEVERITY: CRITICAL" > /tmp/t.txt
          if grep -qE '^REVIEW_SEVERITY: (CRITICAL|WARN|NIT|NONE)$' /tmp/t.txt; then
            echo "Self-test severity parse: OK"
          else
            echo "::error::Self-test FAILED: severity line not detected"
            exit 1
          fi

  agent-review:
    runs-on: ubuntu-latest
    needs: [gate-self-test]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      - name: Skip for Dependabot
        if: github.actor == 'dependabot[bot]'
        run: echo "Dependabot PR - auto-PASS (pure version bump)."
      - name: Advisory agent review
        if: github.actor != 'dependabot[bot]'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::review-gate: ANTHROPIC_API_KEY not available - skipping review."
            exit 0
          fi
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          mkdir -p /tmp/rev
          git diff "$BASE_SHA".."$HEAD_SHA" > /tmp/rev/diff.patch

          cat > /tmp/rev/prompt.md << 'PROMPT'
          You are The Well's code-review gate for this repository. The gate is ADVISORY (findings are reported but do not block merge). Review ONLY the diff below through four lenses:
          - QUALITY: correctness, edge/error paths, swallowed errors, naming, tests for new logic.
          - SECURITY: secrets in code/logs, authZ/RLS gaps, injection, PII/candidate data exposure, unvalidated external input. Any secret exposure or candidate/advisor PII leak is CRITICAL.
          - FIT: does this fit the EXISTING architecture and patterns of THIS repo? Needless duplication or off-pattern design is a WARN or CRITICAL.
          - CONVENTIONS: match the repo stack; validate external input MANUALLY at the boundary (no Zod/pydantic); API errors use { error: string } + HTTP status; no hardcoded secrets.

          Stack: Static design assets and documentation; no runtime server.

          Classify EACH finding as exactly one of:
            CRITICAL = real security hole, candidate/advisor PII exposure, data loss, or a correctness bug that will break prod.
            WARN     = quality or architecture concern worth a look but not dangerous.
            NIT      = style or preference.

          Output format (follow EXACTLY - downstream tooling parses these lines):
          Line 1: VERDICT: PASS or BLOCK  (informational only - gate is advisory, never blocks)
          Then findings, each prefixed with its severity tag:
            [CRITICAL] file:line - problem - fix
            [WARN] file:line - problem - fix
            [NIT] file:line - problem - fix
          Last line MUST be exactly one of:
            REVIEW_SEVERITY: CRITICAL
            REVIEW_SEVERITY: WARN
            REVIEW_SEVERITY: NIT
            REVIEW_SEVERITY: NONE

          DIFF (raw, below this line):
          PROMPT
          head -c 60000 /tmp/rev/diff.patch >> /tmp/rev/prompt.md

          claude -p "$(cat /tmp/rev/prompt.md)" --model sonnet > /tmp/rev/out.txt 2>&1

          SEVERITY=$(grep -oE '^REVIEW_SEVERITY: (CRITICAL|WARN|NIT|NONE)$' /tmp/rev/out.txt | tail -1 | awk '{print $2}')
          [ -z "$SEVERITY" ] && SEVERITY="UNKNOWN"

          {
            echo "## Agent review (advisory)"
            echo ""
            echo "_Lenses: quality, security, fit, conventions. This gate is advisory - findings are classified but do not block merge. CRITICAL findings are surfaced in the morning digest._"
            echo ""
            echo "**Severity: `${SEVERITY}`**"
            echo ""
            echo '```'
            cat /tmp/rev/out.txt
            echo '```'
          } > /tmp/rev/comment.md

          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"             -F body=@/tmp/rev/comment.md >/dev/null             && echo "review comment posted (severity=$SEVERITY)"             || echo "comment post failed"

          echo "===== REVIEW OUTPUT ====="
          cat /tmp/rev/out.txt
          echo "REVIEW_SEVERITY=$SEVERITY"
          # Advisory gate - always exit 0
          exit 0
