name: No Em Dash (Lint)

# Dash policy (2026-10-16): em and en dashes are allowed everywhere except in
# sales/marketing copy, QFS client reply drafts and candidate-facing messages
# (full text: ~/.claude/CLAUDE.md). This repo holds none of that copy, so the
# job always passes. It is kept (same job id) because "no-em-dash" is a
# required status check on main: deleting or renaming it would stall every PR.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  no-em-dash:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dash policy gate (always passes in this repo)
        run: echo "no-em-dash - no sales/marketing/QFS/candidate copy in this repo; nothing to scan (2026-10-16 dash policy)."
